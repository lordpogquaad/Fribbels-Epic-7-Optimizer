# SonarQube Cloud scan of this repo's code, run from "1. App/" with SONAR_TOKEN in the environment.
# Not wired to any script yet (FIX LIST R20). A scan needs the token and the network and uploads
# source, so nothing here runs it.
# The project key and organization are the ones VS Code's connected mode uses
# (".sonarlint/connectedMode.json" at the repo root).
sonar.projectKey=lordpogquaad_Fribbels-Epic-7-Optimizer
sonar.organization=lordpogquaad
sonar.host.url=https://sonarcloud.io

# Renderer, main process, build scripts and the Python scanner helpers. The Java backend is left out
# on purpose: the Java analyzer needs the compiled classes (`sonar.java.binaries`) and the sources sit
# behind symlinked package folders; add it when a Java scan is wanted.
sonar.sources=2. Frontend/1. Source/4. JS,2. Frontend/1. Source/5. TS,2. Frontend/1. Source/7. PY,5. Dev Only,4. Both
sonar.inclusions=**/*.js,**/*.ts,**/*.py
sonar.exclusions=**/node_modules/**,**/logs/**,**/*.d.ts,2. Frontend/1. Source/8. DIST/**
sonar.sourceEncoding=UTF-8

# Keep the scanner's work folder inside node_modules, which every .gitignore here already covers.
sonar.working.directory=node_modules/.scannerwork
